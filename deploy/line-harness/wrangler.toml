# Generated by create-line-harness. Safe to overwrite on future setup runs.
name = "shuuka-line-harness"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "8d08cd2205a607fc8bc534a0950fef09"

# Worker runs before static assets so bot UAs get OGP HTML injection;
# normal UAs fall through to the SPA via env.ASSETS.fetch().
[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "shuuka-line-harness"
database_id = "693686bb-46bb-4f4b-b160-e2da100024fc"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "shuuka-line-harness-images"

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

[vars]
WORKER_NAME = "shuuka-line-harness"
ADMIN_PAGES_PROJECT = "shuuka-line-harness-admin-d2187343"
LIFF_PAGES_PROJECT = ""
D1_DATABASE_ID = "693686bb-46bb-4f4b-b160-e2da100024fc"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
WORKER_PUBLIC_URL = "https://shuuka-line-harness.k-mizutani.workers.dev"
ADMIN_PUBLIC_URL = "https://shuuka-line-harness-admin-d2187343.pages.dev"
LIFF_PUBLIC_URL = "https://shuuka-line-harness.k-mizutani.workers.dev"
CF_ACCOUNT_ID = "8d08cd2205a607fc8bc534a0950fef09"
SHOPIFY_LINK_ORIGIN = "https://shuuka-shopify-line-bridge.k-mizutani.workers.dev"

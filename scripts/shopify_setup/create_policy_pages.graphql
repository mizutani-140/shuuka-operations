mutation CreatePolicyPages {
  legalNotice: pageCreate(page: {
    title: "特定商取引法に基づく表記"
    handle: "legal-notice"
    body: """
<table>
  <tbody>
    <tr><th>販売業者</th><td>株式会社CUBE</td></tr>
    <tr><th>代表責任者</th><td>嶋村 慶太</td></tr>
    <tr><th>所在地</th><td>〒153-0051 東京都目黒区上目黒4-18-25 グレースビル1階</td></tr>
    <tr><th>メールアドレス</th><td>info@shuuka.jp</td></tr>
    <tr><th>販売価格</th><td>商品ごとに表示</td></tr>
    <tr><th>商品代金以外の必要料金</th><td>配送料</td></tr>
    <tr><th>お支払方法</th><td>クレジットカード</td></tr>
    <tr><th>お支払の時期</th><td>クレジットカードの支払い処理は即日行われます。</td></tr>
    <tr><th>商品の引渡時期</th><td>各商品ページまたは注文履歴よりご確認ください。</td></tr>
    <tr><th>商品の引渡方法</th><td>宅配便（ヤマト運輸）にてお届けします。</td></tr>
  </tbody>
</table>
<h2>不良品について</h2>
<p>果物という商品の性質上、味や見た目についてはどうしても個人差があるため、これらを理由とした返品や返金はお受けできません。</p>
<p>商品は最新の注意を払い、検品・梱包・発送をしておりますが、万が一不具合があった場合は、商品到着日の翌日までに状態を写真に撮っていただき、写真を添付の上、メールにてご連絡ください。</p>
<h2>キャンセルについて</h2>
<p>注文確定後のキャンセルは、原則としてお受けしておりません。</p>
<p>ただし「予約販売」の商品については、キャンセル可能な場合もございますので、お早めにご連絡ください。</p>
"""
    isPublished: true
    templateSuffix: "policy"
  }) {
    page { id title handle templateSuffix isPublished }
    userErrors { code field message }
  }

  privacyPolicy: pageCreate(page: {
    title: "プライバシーポリシー"
    handle: "privacy-policy"
    body: """
<p>株式会社CUBE（以下「当社」といいます）は、個人情報の保護に関する法律（以下「個人情報保護法」といいます）その他関連法令を遵守し、当社が運営するECサイトを通じて取得する個人情報について、以下のとおり適切に取り扱うものとします。</p>
<h2>第1条（個人情報の定義）</h2>
<p>本ポリシーにおける「個人情報」とは、個人情報保護法第2条第1項に定義される情報をいい、氏名、住所、電話番号、メールアドレス、クレジットカード情報、購入履歴、その他特定の個人を識別し得る情報を含みます。</p>
<h2>第2条（個人情報の取得および利用目的）</h2>
<p>当社は、以下の目的のために個人情報を取得・利用いたします。</p>
<ul>
  <li>商品の発送、代金決済、注文内容の確認等、当社サービスの提供に必要な業務遂行のため</li>
  <li>お問い合わせ・ご相談等に対する対応のため</li>
  <li>会員登録、ログイン情報の管理およびパスワード再発行等の対応のため</li>
  <li>サービス改善、マーケティング分析、広告効果測定のため</li>
  <li>新商品、キャンペーン、各種ご案内等の送付（電子メール、LINE等含む）のため</li>
  <li>不正利用の防止、システムの保守・障害対応等セキュリティ上の管理のため</li>
  <li>その他、上記各項に付随する業務の遂行のため</li>
</ul>
<h2>第3条（第三者提供の制限）</h2>
<p>当社は、法令に基づく場合を除き、あらかじめご本人の同意を得ることなく、個人情報を第三者に提供いたしません。ただし、以下の場合はこの限りではありません。</p>
<ul>
  <li>法令に基づく場合</li>
  <li>人の生命、身体または財産の保護のために必要がある場合で、本人の同意を得ることが困難であるとき</li>
  <li>国の機関もしくは地方公共団体またはその委託を受けた者が、法令の定める事務を遂行することに対して協力する必要がある場合</li>
</ul>
<h2>第4条（業務委託）</h2>
<p>当社は、業務の全部または一部を外部業者に委託する場合があり、その際には委託先に対して適切な監督を行います。委託の範囲には、商品の発送業務、システム運用等が含まれます。</p>
<h2>第5条（クッキーおよびアクセス解析ツール）</h2>
<p>当社は、ウェブサイトにおける利用状況の分析および利便性向上のため、クッキー（Cookie）および類似技術を使用する場合があります。</p>
<p>また、以下の外部サービスを利用することがあります。これにより取得される情報は、当社の管理下にない第三者（Google LLC、Meta Platforms, Inc. 等）に提供される場合があります。</p>
<ul>
  <li>Google Analytics（Google LLC）</li>
  <li>Meta Pixel（Meta Platforms, Inc.）</li>
  <li>その他、広告配信・効果測定ツール</li>
</ul>
<p>各サービスにおけるデータの取扱いは、それぞれのプライバシーポリシーに従って管理されます。クッキーの無効化をご希望の場合は、ブラウザの設定をご確認ください。</p>
<h2>第6条（個人情報の開示、訂正、利用停止等）</h2>
<p>お客様は、当社に対して、自己の個人情報について、開示、訂正、追加または削除、利用の停止または消去、第三者提供の停止を求めることができます。これらの請求を行う場合は、下記窓口までご連絡ください。</p>
<p>当社は、請求者が本人であることを確認のうえ、合理的な期間内に対応いたします。</p>
<h2>第7条（セキュリティ対策）</h2>
<p>当社は、個人情報の漏洩、滅失または毀損の防止、その他安全管理のため、組織的・技術的・物理的な適切な措置を講じます。</p>
<h2>第8条（未成年者の個人情報）</h2>
<p>未成年者が当社サービスを利用する場合、必ず親権者または法定代理人の同意を得た上で行うものとします。</p>
<h2>第9条（本ポリシーの変更）</h2>
<p>当社は、必要に応じて本ポリシーの内容を変更することがあります。変更後の内容は、本ウェブサイト上に掲示された時点で効力を生じるものとします。</p>
<h2>第10条（お問い合わせ窓口）</h2>
<p>本ポリシーに関するお問い合わせ、個人情報の取扱いに関するご請求は、以下の窓口までお願いいたします。</p>
<p>事業者名：株式会社CUBE<br>所在地：〒153-0051 東京都目黒区上目黒4丁目18-25 グレースビル1階<br>メールアドレス：info@shuuka.jp</p>
"""
    isPublished: true
    templateSuffix: "policy"
  }) {
    page { id title handle templateSuffix isPublished }
    userErrors { code field message }
  }

  termsOfService: pageCreate(page: {
    title: "利用規約"
    handle: "terms-of-service"
    body: """
<p>この利用規約（以下「本規約」といいます）は、株式会社CUBE（以下「当社」といいます）が運営する祝果のECサイト（以下「当サイト」といいます）をご利用いただくにあたってのルールを定めたものです。当サイトをご利用いただくことで、本規約に同意いただいたものとみなします。</p>
<h2>第1条（はじめに）</h2>
<p>当サイトでは、全国の提携生産者などから厳選した果物を販売しています。商品は一部を除き、生産者などの提携パートナーからの直送となります。</p>
<h2>第2条（会員登録について）</h2>
<p>会員登録は任意です。登録いただくことで、注文履歴の確認や発送通知、LINE連携による通知機能など、便利な機能をご利用いただけます。</p>
<h2>第3条（未成年者の利用について）</h2>
<p>未成年の方がご利用になる場合は、必ず親権者または法定代理人の同意を得たうえでご利用ください。</p>
<h2>第4条（禁止事項）</h2>
<p>当サイトのご利用にあたり、以下の行為を禁止します：</p>
<ul>
  <li>虚偽の内容での会員登録</li>
  <li>他の利用者または第三者の権利・利益を侵害する行為</li>
  <li>本サービスの運営を妨げる行為</li>
  <li>その他、公序良俗に反する行為</li>
</ul>
<h2>第5条（商品・価格について）</h2>
<p>商品ごとの価格は、各商品ページにて明記しております。商品代金以外にお客様にご負担いただくのは、配送料のみとなります。</p>
<h2>第6条（支払い方法）</h2>
<p>お支払いは、クレジットカード決済をご利用いただけます。決済処理はご注文時に即時行われます。</p>
<h2>第7条（返品・返金）</h2>
<p>果物という商品の性質上、味や見た目についてはどうしても個人差があるため、これらを理由とした返品や返金はお受けできません。</p>
<p>また、商品は最新の注意を払い、検品・梱包・発送をしておりますが、万が一不具合があった場合は、商品到着日の翌日までに状態を写真に撮っていただき、写真を添付の上、メールまたは公式LINEにてご連絡ください。</p>
<p>メールでのお問合せ先：info@shuuka.jp</p>
<h2>第8条（キャンセルについて）</h2>
<p>ご注文確定後のキャンセルは原則として承っておりません。</p>
<p>ただし、「予約販売」や「在庫確認中」のステータスの場合、キャンセル可能なケースもございます。お早めにお問い合わせください。キャンセルが承認された場合の返金タイミングは、クレジットカード会社の処理スケジュールに準じます。</p>
<h2>第9条（ユーザー投稿・レビュー）</h2>
<p>当サイトでは、商品のレビューなど、ユーザーの投稿機能をご利用いただけます。投稿内容は他の利用者にも表示されるため、誹謗中傷や不適切な表現はご遠慮ください。明らかに不適切と判断される投稿については、当社の判断で削除させていただく場合があります。</p>
<h2>第10条（知的財産権）</h2>
<p>当サイトに掲載されているすべての写真・ロゴ・文章・デザインなどのコンテンツは、当社または当社に使用許諾を与えた第三者に帰属します。無断での転載、複製、加工、配布等はご遠慮ください。</p>
<h2>第11条（規約の変更）</h2>
<p>本規約の内容は、必要に応じて事前の予告なく変更することがあります。最新の内容は当サイト上にて随時ご確認ください。</p>
"""
    isPublished: true
    templateSuffix: "policy"
  }) {
    page { id title handle templateSuffix isPublished }
    userErrors { code field message }
  }

  refundPolicy: pageCreate(page: {
    title: "返品・返金ポリシー"
    handle: "refund-policy"
    body: """
<p>祝果では、すべての商品を最新の注意を払って検品・梱包・発送しております。しかしながら、万が一不具合があった場合には、以下のポリシーに基づきご対応いたします。</p>
<h2>返品・返金の対象について</h2>
<p>果物という商品の特性上、味や見た目に関する感じ方には個人差がございます。そのため、下記を理由とした返品・返金はお受けしておりません。</p>
<ul>
  <li>味・香り・甘さなどの個人差によるもの</li>
  <li>形や色、大きさなどの見た目に関するご不満</li>
  <li>お客様のご都合によるキャンセル・返品</li>
</ul>
<h2>傷み・破損があった場合の対応</h2>
<p>以下のような、明らかな商品の不具合・配送事故等による問題があった場合には、返金、もしくは代替品の再送等にて対応させていただきます。</p>
<ul>
  <li>著しい傷み・腐敗</li>
  <li>ご注文内容と異なる商品が届いた</li>
  <li>梱包の破損等による品質劣化</li>
</ul>
<p>商品の状態を確認させていただいたうえで、返金・再送などの対応を個別にご案内いたします。在庫や季節状況により、対応方法は異なる場合がございます。予めご了承ください。</p>
<h2>ご連絡期限と手順</h2>
<p>商品に不備があった場合は、商品到着日の翌日までに以下の情報を添えてご連絡ください。</p>
<ul>
  <li>商品の全体写真</li>
  <li>不具合箇所の拡大写真</li>
  <li>外装・伝票の写真（破損時）</li>
</ul>
<h2>ご連絡先</h2>
<p>公式LINEまたは、メールにてご連絡ください。</p>
<p>メールアドレス：info@shuuka.jp</p>
<p>対応時間：平日10:00〜17:00（土日祝除く）<br>※上記以外のお問い合わせには、対応までにお時間をいただく場合がございます。</p>
"""
    isPublished: true
    templateSuffix: "policy"
  }) {
    page { id title handle templateSuffix isPublished }
    userErrors { code field message }
  }

  shippingPolicy: pageCreate(page: {
    title: "配送ポリシー"
    handle: "shipping-policy"
    body: """
<h2>送料と配送について</h2>
<p>祝果では、生産者を中心とした全国の提携パートナーから、旬の果物を新鮮なまま直送でお送りしています。</p>
<p>果物本来のおいしさをお届けするため、それぞれに最適なタイミングで収穫・発送を行っており、配送日のご指定は承っておりません。</p>
<p>また、発送元や箱のサイズにより送料が異なりますので、ご注文前に以下の内容をご確認ください。</p>
<h2>配送業者・配送方法</h2>
<p>商品はすべてヤマト運輸の宅急便でお届けいたします。<br>※配送は日本国内に限らせていただきます。</p>
<p>ご注文状況の確認や発送通知は、会員登録後にLINE連携いただくとスムーズにご利用いただけます。会員登録は <a href="/account">こちら</a> ／ 公式LINEは <a href="https://lin.ee/sEgCPJs" target="_blank" rel="noopener">こちら</a>からご利用いただけます。</p>
<h2>発送元</h2>
<p>商品は、生産者を中心とした全国の提携パートナーから直送しております。ご注文いただいた商品が複数の農家からの発送となる場合、それぞれ別送となります。発送元や箱サイズにより送料が異なります。</p>
<h2>送料について</h2>
<p>送料は、以下の3つの要素に基づいて決定されます。</p>
<ul>
  <li>【発送元】商品を出荷する提携農家などの所在地</li>
  <li>【お届け先】ご注文者様の配送先地域</li>
  <li>【箱のサイズ】ご注文内容に応じた梱包サイズ（例：60サイズ／80サイズ など）</li>
</ul>
<p>※送料の目安は以下をご参考ください。実際の送料はカートページまたは決済画面でご確認いただけます。<br>※祝果では離島への発送も承っており、追加料金は発生いたしません。<br>※送料一覧は <a href="/pages/shipping-rates">こちら</a>からご覧いただけます。</p>
<p>ご注文前に送料を確認されたい場合は、カートページにてお届け先を入力いただくと、送料のお見積もりをご確認いただけます。ご不明点がありましたら、ページ右下のチャットよりお気軽にお問い合わせください。</p>
"""
    isPublished: true
    templateSuffix: "policy"
  }) {
    page { id title handle templateSuffix isPublished }
    userErrors { code field message }
  }
}
